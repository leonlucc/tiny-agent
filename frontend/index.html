<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>极简智能体</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 侧边栏 - Logo 区 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <h1><img src="assets/logo.png" alt="Logo" class="logo-img"> <span>极简智能体</span></h1>
                <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="切换侧边栏" aria-label="收起侧边栏" aria-expanded="true">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </div>
            <button class="new-session-button" id="new-session-button" type="button">
                <i class="fas fa-plus-circle" aria-hidden="true"></i>
                <span>新建会话</span>
            </button>
        </div>
        <div class="sidebar-content">
            <section class="session-history" aria-labelledby="session-history-title">
                <h2 id="session-history-title">会话历史</h2>
                <div class="session-list" id="session-list"></div>
            </section>
        </div>

    </aside>

    <button class="mobile-toggle" id="mobile-toggle" type="button" aria-label="打开侧边栏" aria-expanded="false">
        <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <dialog class="session-dialog" id="session-dialog">
        <form method="dialog" id="session-dialog-form">
            <h2 id="session-dialog-title">会话操作</h2>
            <p id="session-dialog-description"></p>
            <label class="session-name-field" id="session-name-field">
                <span>会话名称</span>
                <input id="session-name-input" type="text" maxlength="80" autocomplete="off">
            </label>
            <div class="session-dialog-actions">
                <button class="dialog-cancel-button" type="button" id="session-dialog-cancel">取消</button>
                <button class="dialog-confirm-button" type="submit" id="session-dialog-confirm">保存</button>
            </div>
        </form>
    </dialog>

    <!-- 主聊天区域 -->
    <div class="main-content">
        <div class="chat-header">
            <div class="chat-title" id="current-chat-title">实时对话</div>
        </div>

        <div class="chat-container" id="chat-container">
            <!-- 消息和空状态将通过 JS 动态生成 -->
        </div>

        <template id="empty-state-template">
            <div class="empty-state">
                <img src="assets/logo.png" alt="Logo" class="logo-img">
                <h2>欢迎使用极简智能体</h2>
                <p>请开始您的问题或输入需求</p>
            </div>
        </template>
        
        <template id="typing-indicator-template">
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <span>正在思考...</span>
            </div>
        </template>

        <template id="user-message-template">
            <div class="message user-message">
                <div class="message-content"></div>
            </div>
        </template>

        <template id="assistant-message-template">
            <div class="message assistant-message">
                <details class="thinking-section" hidden open>
                    <summary>思考过程</summary>
                    <div class="thinking-content"></div>
                </details>
                <div class="message-content"></div>
            </div>
        </template>

        <div class="input-container">
            <div class="message-input-wrapper">
                <textarea
                    class="message-input"
                    id="message-input"
                    placeholder="发消息..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="send-button" disabled aria-label="发送消息">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-hint">内容由 AI 生成，仅供参考</span>
            <div class="connection-status" id="connection-status">
                <div class="connection-dot"></div>
                <span data-connection-label>已连接</span>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
